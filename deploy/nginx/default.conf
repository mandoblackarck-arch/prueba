server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;

  location /api/auth/ { proxy_pass http://identity:8080; }
  location /api/products { proxy_pass http://catalog:8080; }
  location /api/orders { proxy_pass http://orders:8080; }

  location /swagger/auth/ { proxy_pass http://identity:8080/swagger/; }
  location /swagger/products/ { proxy_pass http://catalog:8080/swagger/; }
  location /swagger/orders/ { proxy_pass http://orders:8080/swagger/; }

  location = /swagger/auth { return 301 /swagger/auth/; }
  location = /swagger/products { return 301 /swagger/products/; }
  location = /swagger/orders { return 301 /swagger/orders/; }
}
